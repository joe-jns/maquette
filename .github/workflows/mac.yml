# Version Mac de Maquette : construite sur un Mac de GitHub (impossible depuis Windows).
# Les .dmg (Apple Silicon et Intel) sont à télécharger dans l'onglet Actions, rubrique « Artifacts ».
name: Mac

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Les tests disent ce qui casse sur Mac, sans empêcher la construction.
      - run: npm test
        continue-on-error: true
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v7
        with:
          name: Maquette-mac
          path: dist/*.dmg
          retention-days: 30
