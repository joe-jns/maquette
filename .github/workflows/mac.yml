# Version Mac de Maquette : construite sur un Mac de GitHub (impossible depuis Windows).
# Les .dmg (Apple Silicon et Intel) sont à télécharger dans l'onglet Actions, rubrique « Artifacts ».
name: Mac

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Les tests disent ce qui casse sur Mac, sans empêcher la construction.
      - run: npm test
        continue-on-error: true
      # Icône des fichiers .maquette dans le Finder : un .icns, fait ici avec les outils du Mac.
      - name: Icône .icns
        run: |
          mkdir -p build/icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s build/icon.png --out build/icon.iconset/icon_${s}x${s}.png
            sips -z $((s*2)) $((s*2)) build/icon.png --out build/icon.iconset/icon_${s}x${s}@2x.png
          done
          iconutil -c icns build/icon.iconset -o build/icon.icns
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v7
        with:
          name: Maquette-mac
          path: dist/*.dmg
          retention-days: 30
