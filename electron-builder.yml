# Installateurs de Maquette : Windows (npm run dist) et Mac (npm run dist:mac).
appId: yt.joe.maquette
productName: Maquette
copyright: Copyright © 2026 Joakim Janssens
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
# La copie de taste-skill reste hors de l'archive : draw.mjs est lancé comme un vrai fichier.
extraResources:
  - from: vendor/taste-skill
    to: vendor/taste-skill
  # Guides et styles lus à la demande par les outils MCP guide et style (src/main/design.ts).
  - from: vendor/design
    to: vendor/design
win:
  target: nsis
  icon: build/icon.ico
# Mac (npm run dist:mac, sur un Mac ou dans GitHub Actions) : signature « ad hoc », sans compte Apple.
# Le Mac refuse un premier lancement par double-clic : clic droit sur l'app, puis Ouvrir.
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: build/icon.png
  category: public.app-category.graphics-design
  identity: '-'
  hardenedRuntime: false
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Maquette
fileAssociations:
  - ext: maquette
    name: Maquette
    description: Maquette de site
    icon: build/icon.ico
    role: Editor
